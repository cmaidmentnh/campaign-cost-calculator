{% extends "base.html" %}

{% block title %}Admin Login - Campaign Cost Calculator{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md animate-in">
        <!-- Card -->
        <div class="glass rounded-2xl p-8">
            <!-- Logo/Icon -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-accent-400 to-purple-500 flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold gradient-text">Admin Login</h1>
                <p class="text-dark-400 text-sm mt-2">Enter your password to continue</p>
            </div>

            {% if error %}
            <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="text-sm">{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div>
                    <label for="password" class="block text-sm font-medium text-dark-300 mb-2">Password</label>
                    <input type="password" name="password" id="password" required autofocus
                           placeholder="Enter your password"
                           class="w-full px-4 py-3 rounded-xl text-sm placeholder-dark-500">
                </div>

                <button type="submit" class="w-full btn-primary text-white font-semibold py-3 px-4 rounded-xl">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{{ url_for('calculator') }}" class="text-sm text-dark-400 hover:text-accent-400 transition-colors inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Back to Calculator
                </a>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-dark-500 text-xs mt-6">
            Campaign Cost Calculator
        </p>
    </div>
</div>
{% endblock %}
